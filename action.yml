name: Peak test upload
description: 'Run your tests with Peak (shard, failed-first, retry flaky) and upload test results and coverage with the job''s OIDC token: no secret.'
author: Peak
branding:
  icon: upload-cloud
  color: blue
inputs:
  files:
    description: 'JUnit XML files or patterns (for example `junit.xml` or `reports/**/*.xml`), separated by spaces or new lines.'
    required: false
    default: ''
  framework:
    description: 'The framework that wrote the JUnit reports: pytest, unittest, go, node, jest, vitest, playwright, bun or junit.'
    required: false
    default: ''
  coverage:
    description: 'Coverage reports or patterns (for example `coverage/lcov.info`), separated by spaces or new lines.'
    required: false
    default: ''
  run:
    description: 'Optional. The test command, run through `peak tests run`; the action exits with its code and uploads either way.'
    required: false
    default: ''
  working-directory:
    description: 'Optional. Where to run the command and find `files` and `coverage`.'
    required: false
    default: ''
  shard:
    description: 'Optional, with `run`. This shard, as I/N (for example 2/4). pytest and unittest.'
    required: false
    default: ''
  failed-first:
    description: 'Optional, with `run`. Run changed and recently failing test files first. pytest and unittest.'
    required: false
    default: 'false'
  retry-flaky:
    description: 'Optional, with `run`. Rerun a failed test once when Peak lists it as flaky. pytest and unittest.'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Run and upload tests with Peak
      shell: bash
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_FRAMEWORK: ${{ inputs.framework }}
        INPUT_COVERAGE: ${{ inputs.coverage }}
        INPUT_RUN: ${{ inputs.run }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_SHARD: ${{ inputs.shard }}
        INPUT_FAILED_FIRST: ${{ inputs.failed-first }}
        INPUT_RETRY_FLAKY: ${{ inputs.retry-flaky }}
        PEAK_JOB_ID: ${{ job.check_run_id }}
      run: '"$GITHUB_ACTION_PATH/upload.sh"'

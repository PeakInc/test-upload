name: Test the action
# Runs the action on a small pytest project, on Linux and macOS. No id-token here: Peak's plan and the upload fail open
# (a warning), which is what these checks rely on. They check the exit codes, where the report lands, and that a script
# runs as written.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: A small pytest project
        run: |
          python -m pip install pytest==9.2.0
          mkdir -p svc/tests
          printf 'def test_a():\n    assert True\n' > svc/tests/test_a.py
          printf 'import os\n\ndef test_b():\n    assert os.environ.get("FAIL") != "1"\n' > svc/tests/test_b.py

      - name: Passing tests, sharded, with working-directory
        id: pass
        uses: ./
        with:
          run: pytest -q -o junit_family=xunit1 --junitxml=junit.xml -m "not slow" tests
          working-directory: svc
          shard: 1/2
          failed-first: true
          retry-flaky: true
          framework: pytest
          files: junit.xml
      - name: Failing tests
        id: fail
        continue-on-error: true
        uses: ./
        env:
          FAIL: '1'
        with:
          run: pytest -q --junitxml=fail.xml tests
          working-directory: svc
          files: fail.xml
      - name: A script runs as written
        id: script
        continue-on-error: true
        uses: ./
        env:
          FAIL: '1'
        with:
          run: |
            cd svc
            pytest -q --junitxml=script.xml tests
          shard: 1/2
          files: svc/script.xml
      - name: Upload only
        id: upload
        uses: ./
        with:
          files: svc/junit.xml
      - name: Check
        env:
          PASS: ${{ steps.pass.outcome }}
          FAIL_OUTCOME: ${{ steps.fail.outcome }}
          SCRIPT: ${{ steps.script.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          set -x
          test "$PASS" = success
          test "$FAIL_OUTCOME" = failure
          test "$SCRIPT" = failure
          test "$UPLOAD" = success
          test -s svc/junit.xml && test -s svc/fail.xml && test -s svc/script.xml
          peak --version | grep -q '^peak 0.9.0'
